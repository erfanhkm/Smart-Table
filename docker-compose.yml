services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smarttable
      POSTGRES_PASSWORD: smarttable
      POSTGRES_DB: smarttable
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      - db
    environment:
      PORT: 3000
      APP_URL: ${APP_URL:-http://localhost:3000}
      DATABASE_URL: postgres://smarttable:smarttable@db:5432/smarttable
      SQUARE_ENV: ${SQUARE_ENV:-sandbox}
      SQUARE_ACCESS_TOKEN: ${SQUARE_ACCESS_TOKEN:-}
      SQUARE_LOCATION_ID: ${SQUARE_LOCATION_ID:-}
      SQUARE_APP_ID: ${SQUARE_APP_ID:-}
      SQUARE_APP_SECRET: ${SQUARE_APP_SECRET:-}
      SQUARE_WEBHOOK_SIGNATURE_KEY: ${SQUARE_WEBHOOK_SIGNATURE_KEY:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
    ports:
      - "3000:3000"
    command: sh -c "npm run migrate && npm start"

volumes:
  pgdata:
