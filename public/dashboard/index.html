<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Smart Table Staff Dashboard</title>
    <style>
        :root {
            --navy: #0E1B2C;
            --paper: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-main: #1E293B;
            --text-muted: #64748B;
            --border: #E2E8F0;
            --blue: #2F80ED;
            --amber: #F59E0B;
            --green: #16A34A;
            --red: #DC2626;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Inter, system-ui, sans-serif; }
        body { background: var(--paper); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        aside { width: 260px; background: var(--navy); color: white; display: flex; flex-direction: column; padding: 20px; }
        .brand { font-size: 1.2rem; font-weight: 700; margin-bottom: 30px; letter-spacing: -0.025em; display: flex; align-items: center; justify-content: space-between; }
        .brand span { color: var(--amber); }
        .nav-item { padding: 12px 16px; border-radius: 10px; color: #94A3B8; font-weight: 600; font-size: 0.95rem; cursor: pointer; margin-bottom: 6px; }
        .nav-item.active, .nav-item:hover { background: rgba(255,255,255,0.1); color: white; }

        main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        header { background: white; border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
        .header-left { display: flex; align-items: center; gap: 20px; }
        select { padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.9rem; background: white; font-weight: 600; }
        .clock { font-size: 0.95rem; font-weight: 600; color: var(--text-muted); }

        .dashboard-body { flex: 1; padding: 24px; overflow-y: auto; display: grid; grid-template-columns: 1fr 340px; gap: 24px; }
        @media (max-width: 1024px) { .dashboard-body { grid-template-columns: 1fr; } }

        .metrics-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
        .metric-card { background: white; border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
        .metric-title { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; }
        .metric-value { font-size: 1.4rem; font-weight: 700; color: var(--navy); font-variant-numeric: tabular-nums; }

        .floor-section { display: flex; flex-direction: column; }
        .section-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
        .tables-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 16px; }
        
        .table-card { background: white; border: 2px solid var(--border); border-radius: 14px; padding: 16px; cursor: pointer; position: relative; transition: all 0.2s; display: flex; flex-direction: column; justify-content: space-between; height: 110px; }
        .table-card.FREE { border-color: var(--border); background: #F8FAFC; }
        .table-card.SEATED { border-color: var(--blue); background: #EFF6FF; }
        .table-card.PAYING { border-color: var(--amber); background: #FEF3C7; }
        .table-card.PAID { border-color: var(--green); background: #F0FDF4; }
        .table-name { font-size: 1.1rem; font-weight: 700; color: var(--navy); }
        .table-state { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }

        .pulse-badge { position: absolute; top: -8px; right: -8px; background: var(--red); color: white; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700; box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(220, 38, 38, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); } }

        .sidebar-panel { background: white; border: 1px solid var(--border); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; height: fit-content; }
        .call-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
        .call-item:last-child { border-bottom: none; }
        .btn-ack { background: var(--navy); color: white; border: none; padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; font-weight: 600; cursor: pointer; }

        .drawer-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; justify-content: flex-end; z-index: 100; }
        .drawer { width: 420px; background: white; height: 100%; padding: 24px; display: flex; flex-direction: column; overflow-y: auto; box-shadow: -10px 0 25px rgba(0,0,0,0.1); }
        .drawer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-close { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-muted); }

        .btn-action { background: var(--navy); color: white; border: none; border-radius: 10px; padding: 12px; font-weight: 600; width: 100%; cursor: pointer; margin-bottom: 12px; }
        .btn-secondary { background: white; color: var(--navy); border: 1px solid var(--border); border-radius: 10px; padding: 12px; font-weight: 600; width: 100%; cursor: pointer; margin-bottom: 12px; }
        .btn-danger { background: #FEF2F2; color: var(--red); border: 1px solid #FCA5A5; border-radius: 10px; padding: 12px; font-weight: 600; width: 100%; cursor: pointer; }

        .auth-modal { position: fixed; inset: 0; background: var(--navy); z-index: 1000; display: flex; align-items: center; justify-content: center; }
        .auth-box { background: white; padding: 30px; border-radius: 20px; width: 100%; max-width: 400px; box-shadow: 0 20px 25px rgba(0,0,0,0.2); }
        .auth-box h2 { margin-bottom: 16px; color: var(--navy); }
        .auth-box input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 16px; font-size: 1rem; }
    </style>
</head>
<body>
    <div class="auth-modal" id="auth-modal" style="display: none;">
        <div class="auth-box">
            <h2>Staff Authentication</h2>
            <p style="font-size:0.9rem; color:var(--text-muted); margin-bottom:16px;">Enter your staff API token to access the floor dashboard.</p>
            <input type="password" id="staff-token-input" autocomplete="off" placeholder="Enter bearer token...">
            <div id="auth-error" role="alert" style="color:#dc2626;font-size:0.85rem;margin-bottom:10px;display:none;"></div>
            <button class="btn-action" data-action="save-token">Authenticate</button>
        </div>
    </div>

    <aside>
        <div class="brand">Smart Table <span>Staff</span></div>
        <div class="nav-item active">Floor Map</div>
        <div class="nav-item" data-action="reports">Reports & Sales</div>
    </aside>

    <main>
        <header>
            <div class="header-left">
                <select id="location-select"></select>
                <div class="clock" id="live-clock">--:--:--</div>
            </div>
            <div style="display:flex; align-items:center; gap:12px;">
                <span id="conn-status" style="font-size:0.85rem; font-weight:600; color:var(--green);">● Live Connected</span>
                <button data-action="logout" style="background:none; border:none; color:var(--text-muted); font-size:0.85rem; cursor:pointer; font-weight:600;">Logout</button>
            </div>
        </header>

        <div class="dashboard-body">
            <div class="floor-section">
                <div class="metrics-strip">
                    <div class="metric-card">
                        <div class="metric-title">Settled Checks</div>
                        <div class="metric-value" id="m-settled">-</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-title">Avg Settlement</div>
                        <div class="metric-value" id="m-settle-time">-</div>
                    </div>
                    <div class="metric-card" id="metric-response-card">
                        <div class="metric-title">Waiter Response</div>
                        <div class="metric-value" id="m-response-time">-</div>
                    </div>
                    <div class="metric-card" id="metric-calls-card">
                        <div class="metric-title">Open Waiter Calls</div>
                        <div class="metric-value" id="m-open-calls">-</div>
                    </div>
                </div>

                <div class="section-title">
                    <span>Floor Map</span>
                    <button class="btn-action" style="width:auto; padding:8px 16px; margin:0; font-size:0.85rem;" data-action="add-table">+ Add Table</button>
                </div>
                <div class="tables-grid" id="tables-grid"></div>
            </div>

            <div class="sidebar-panel" id="waiter-panel">
                <div class="section-title" style="margin-bottom:12px;">Waiter Calls</div>
                <div id="waiter-calls-list">
                    <p style="font-size:0.9rem; color:var(--text-muted);">No active waiter calls.</p>
                </div>
            </div>
        </div>
    </main>

    <div class="drawer-backdrop" id="drawer-backdrop">
        <div class="drawer" id="table-drawer"></div>
    </div>

    <script src="/dashboard/app.js?v=0.10.7" defer></script>
</body>
</html>
